<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beli</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050b18;color:#e6f6ff;font-family:system-ui,sans-serif}
.c{width:min(92vw,460px);padding:28px;border-radius:24px;border:1px solid rgba(125,211,252,.4);background:rgba(10,20,40,.7)}
h1{margin:0 0 4px;font-size:22px}p{margin:0 0 12px;color:#9fd8f0}label{display:block;font-size:13px;margin:12px 0 4px;color:#9fd8f0}
input,select{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid rgba(125,211,252,.4);background:#0b1730;color:#fff;font-size:15px}
#pp{margin-top:18px}#msg{min-height:20px;margin-top:12px;font-size:14px}#ds{font-size:14px;margin-top:8px;color:#cfe9f7}
#done{display:none;margin-top:18px;text-align:center}#code{display:block;margin:10px 0;padding:14px;border-radius:12px;background:rgba(56,189,248,.15);font:700 18px monospace;word-break:break-all}
button{padding:10px 18px;border-radius:12px;border:1px solid #38bdf8;background:transparent;color:#e6f6ff;cursor:pointer}
.back{display:inline-block;margin-top:18px;padding:10px 26px;border-radius:12px;border:1px solid rgba(125,211,252,.3);background:transparent;color:#9fd8f0;font-weight:600;font-size:14px;letter-spacing:.6px;transition:.25s}
.back:hover{border-color:#38bdf8;color:#e6f6ff;background:rgba(56,189,248,.12)}
.emb body{place-items:start center;padding:0;min-height:0}
.emb .c{width:100%;border:0;border-radius:0;background:transparent;padding:54px 22px 28px;box-sizing:border-box}
</style><script>try{if(window.self!==window.top||/[?&]embed=1/.test(location.search))document.documentElement.className='emb'}catch(e){document.documentElement.className='emb'}</script></head><body><main class="c">
<h1 id="nm">Beli</h1><p>Pembayaran aman lewat PayPal</p>
<label for="s">Pilih produk atau jasa</label><select id="s"></select><div id="ds"></div>
<label for="n">Nama lengkap</label><input id="n" maxlength="80" autocomplete="name">
<label for="e">Email</label><input id="e" type="email" maxlength="120" autocomplete="email">
<div id="pp"></div><div id="msg"></div>
<button id="bt" type="button" class="back">Batal</button>
<div id="done"><b>Pembayaran berhasil.</b><span id="code"></span><button id="cp" type="button">Salin kode</button><p style="margin-top:12px">Simpan kode ini sebagai bukti pembelian dan kunci akses.</p><button type="button" class="back" id="home">Kembali ke web</button></div>
</main>
<script>
const DB='https://aslb-189b4-default-rtdb.asia-southeast1.firebasedatabase.app';
const $=i=>document.getElementById(i);let P={};
const say=(t,bad)=>{$('msg').textContent=t;$('msg').style.color=bad?'#fca5a5':'#a7f3d0'};
const ok=()=>$('n').value.trim().length>1&&/^\S+@\S+\.\S+$/.test($('e').value.trim());
const show=()=>{const p=P[$('s').value];$('ds').textContent=p?('US$ '+Number(p.price).toFixed(2)):''};
function parsePrice(v){var s=String(v==null?'':v).replace(/[^\d.,]/g,'');if(!s)return 0;var lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
 if(lc>-1&&ld>-1){s=lc>ld?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}
 else if(lc>-1){s=(/,\d{1,2}$/.test(s)&&s.split(',').length===2)?s.replace(',','.'):s.replace(/,/g,'')}
 else if(ld>-1){if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'')}
 var n=parseFloat(s);return isFinite(n)&&n>0&&n<1e7?Math.round(n*100)/100:0}
$('s').onchange=show;
const EMB=document.documentElement.className==='emb';
const goHome=()=>{if(EMB){try{parent.postMessage({bf:'close'},location.origin)}catch(e){location.href='/'}}else location.href='/'};
$('bt').onclick=goHome;
$('home').onclick=goHome;
$('cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText($('code').textContent);$('cp').textContent='Tersalin'};
(async()=>{
 const J=async u=>{const r=await fetch(u,{cache:'no-store'});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j};
 const [c,pr,pj]=await Promise.all([J('/api/config'),J(DB+'/products.json'),J(DB+'/profile/projects.json')]);
 if(!c)throw 0;
 $('nm').textContent=c.name;
 if(pr&&!pr.error)Object.keys(pr).forEach(k=>{const p=pr[k];if(p&&p.active!==false&&Number(p.price)>0)P[k]={name:String(p.name),price:Number(p.price),desc:p.desc||''}});
 const list=Array.isArray(pj)?pj:Object.values(pj||{});
 list.forEach(x=>{if(!x||!x.t)return;const u=parsePrice(x.price);if(u>0)P['pj:'+x.t]={name:String(x.t),price:u,desc:String(x.d||x.desc||'').slice(0,160)}});
 Object.keys(P).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=P[k].name;$('s').appendChild(o)});
 if(!Object.keys(P).length){
  const nPj=list.filter(x=>x&&x.t).length,nPr=pr&&!pr.error?Object.keys(pr).length:0;
  say(pr&&pr.error?'Data ditolak Firebase: '+pr.error:(pj===null?'Data proyek tidak terbaca. Cek internet lalu muat ulang.':(nPj?'Ada '+nPj+' proyek, tapi belum ada yang punya harga. Isi kolom harga di editor Proyek (admin), lalu simpan.':'Belum ada proyek atau produk yang dijual. Produk terbaca: '+nPr+'.')),1);return}
 const sp=new URLSearchParams(location.search),q=sp.get('p'),pjq=sp.get('pj');
 if(pjq&&P['pj:'+pjq])$('s').value='pj:'+pjq;else if(q&&P[q])$('s').value=q;
 show();
 if(!c.clientId)throw new Error('PAYPAL_CLIENT_ID belum diatur di Vercel.');
 if(!['live','sandbox'].includes(String(c.mode||'').toLowerCase()))throw new Error('PAYPAL_ENV harus diisi live atau sandbox di Vercel.');
 const s=document.createElement('script');
 s.src='https://www.paypal.com/sdk/js?client-id='+encodeURIComponent(c.clientId)+'&currency=USD&intent=capture';
 s.onerror=()=>say('PayPal SDK gagal dimuat. Periksa koneksi, Client ID, dan mode '+c.mode+'.',1);
 s.onload=()=>paypal.Buttons({
  onClick:(d,a)=>{if(!ok()){say('Isi nama dan email dulu.',1);return a.reject()}say('')},
  createOrder:async()=>{const k=$('s').value,b=k.indexOf('pj:')===0?{projectTitle:k.slice(3)}:{productId:k};
   const r=await fetch('/api/paypal-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok||!j.id)throw new Error(j.error||'Server gagal membuat pesanan.');return j.id},
  onApprove:async d=>{say('Memverifikasi pembayaran...');
   const r=await fetch('/api/paypal-capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderID:d.orderID,name:$('n').value.trim(),email:$('e').value.trim()})});const j=await r.json().catch(()=>({}));
   if(r.ok&&j.code){$('bt').style.display='none';$('pp').style.display='none';$('done').style.display='block';$('code').textContent=j.code;say('')}else say(j.error||'Gagal. Simpan nomor pesanan: '+d.orderID,1)},
  onCancel:()=>say('Pembayaran dibatalkan. Anda dapat mencoba kembali.',1),
  onError:e=>{console.error('PayPal checkout',e);say('PayPal mengalami kendala. Periksa konfigurasi server atau coba kembali.',1)}
 }).render('#pp').catch(e=>{console.error(e);say('Tombol PayPal gagal ditampilkan. Periksa Client ID dan mode pembayaran.',1)});
 document.head.appendChild(s);
})().catch(e=>{console.error('checkout setup',e);say((e&&e.message)||'Halaman pembelian belum dikonfigurasi.',1)});
</script></body></html>
