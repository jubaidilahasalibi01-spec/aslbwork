<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Produk</title>
<style>
body{margin:0;padding:18px;background:#050b18;color:#e6f6ff;font:15px/1.5 system-ui,sans-serif}.w{max-width:560px;margin:auto}
h1{font-size:20px}input,textarea{width:100%;box-sizing:border-box;margin:4px 0 10px;padding:11px;border-radius:12px;border:1px solid rgba(125,211,252,.4);background:#0b1730;color:#fff;font-size:15px}
button{padding:9px 16px;margin:2px;border-radius:12px;border:1px solid #38bdf8;background:transparent;color:#e6f6ff;cursor:pointer}
.i{padding:12px;margin:8px 0;border-radius:14px;border:1px solid rgba(125,211,252,.3)}#m{min-height:20px;color:#fca5a5}.s{display:none}
</style></head><body><div class="w">
<h1>Kelola Produk dan Jasa</h1>
<div id="lg"><input id="em" type="email" placeholder="Email admin"><input id="pw" type="password" placeholder="Kata sandi"><button id="in" type="button">Masuk</button></div>
<div id="ap" class="s">
<input id="nm" placeholder="Nama (bebas: Web Portofolio, Jasa Edit Video, dll)" maxlength="100">
<input id="pr" type="number" min="1" step="0.01" placeholder="Harga dalam USD">
<textarea id="ds" rows="3" placeholder="Deskripsi singkat" maxlength="300"></textarea>
<label><input id="ac" type="checkbox" checked style="width:auto"> Aktif dijual</label><br>
<button id="sv" type="button">Simpan produk</button><button id="cl" type="button">Kosongkan form</button>
<h1 style="margin-top:22px">Daftar produk</h1><div id="ls"></div></div>
<div id="m"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({apiKey:'AIzaSyCd3OEcXD5MCjEGfbVxwX3SagmMbFF-fc0',authDomain:'aslb-189b4.firebaseapp.com',databaseURL:'https://aslb-189b4-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'aslb-189b4',appId:'1:28348072066:web:eda232f21a9669eb35f49b'});
const $=i=>document.getElementById(i),db=firebase.database(),R=db.ref('products');let cur=null;
const err=t=>{$('m').textContent=t||''};
firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION);
$('in').onclick=async()=>{err();try{await firebase.auth().signInWithEmailAndPassword($('em').value.trim(),$('pw').value)}catch(e){err('Login gagal: '+(e.code||e.message))}};
const clr=()=>{cur=null;$('nm').value='';$('pr').value='';$('ds').value='';$('ac').checked=true};$('cl').onclick=clr;
$('sv').onclick=async()=>{err();const n=$('nm').value.trim(),p=Number($('pr').value);if(!n||!(p>0)){err('Isi nama dan harga yang benar.');return}
 try{await (cur?R.child(cur):R.push()).set({name:n,price:p,desc:$('ds').value.trim(),active:$('ac').checked,ts:Date.now()});clr()}catch(e){err('Gagal menyimpan: '+(e.code||e.message))}};
firebase.auth().onAuthStateChanged(u=>{$('lg').style.display=u?'none':'block';$('ap').style.display=u?'block':'none';if(u)R.on('value',s=>{const l=$('ls');l.textContent='';const v=s.val()||{};
 Object.keys(v).forEach(k=>{const p=v[k],d=document.createElement('div');d.className='i';
  const t=document.createElement('div');t.textContent=p.name+' - US$ '+Number(p.price).toFixed(2)+(p.active===false?' (nonaktif)':'');d.appendChild(t);
  const e=document.createElement('button');e.textContent='Edit';e.onclick=()=>{cur=k;$('nm').value=p.name;$('pr').value=p.price;$('ds').value=p.desc||'';$('ac').checked=p.active!==false;scrollTo(0,0)};
  const x=document.createElement('button');x.textContent='Hapus';x.onclick=()=>{if(confirm('Hapus produk ini?'))R.child(k).remove()};
  const a=document.createElement('button');a.textContent='Salin link beli';a.onclick=()=>navigator.clipboard&&navigator.clipboard.writeText('https://aslbwork.vercel.app/beli.html?p='+k);
  d.append(e,x,a);l.appendChild(d)})},e=>err('Gagal membaca: '+(e.code||e.message)))});
</script></body></html>
